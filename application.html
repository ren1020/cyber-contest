<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申し込みフォーム - 防衛省企業プロジェクト</title>
    <meta name="description" content="サイバーコンテストの申し込みフォーム">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="index.html">防衛省企業プロジェクト</a>
            <button id="navToggle" class="nav-toggle" aria-expanded="false" aria-controls="siteNav">Menu</button>
            <nav id="siteNav" class="site-nav" aria-label="主要ナビゲーション">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="overview.html">大会概要</a></li>
                    <li><a href="records.html">過去の記録と結果</a></li>
                    <li><a href="news.html">お知らせ</a></li>
                    <li><a href="venue.html">参加のご案内</a></li>
                    <li><a href="application.html" aria-current="page">申し込みフォーム</a></li>
                    <li><a href="quiz.html">問題集</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="overview-hero">
            <span class="eyebrow">Application</span>
            <h1>申し込みフォーム</h1>
            <p>必要事項を入力して、大会への参加を申し込みます。</p>
        </section>

        <section class="panel application-panel" aria-labelledby="application-title">
            <div class="section-heading">
                <span class="eyebrow">Entry Form</span>
                <h2 id="application-title">参加申し込み</h2>
            </div>
            <form class="application-form" action="#" method="post">
                <div class="form-field">
                    <label for="name">氏名 <span aria-hidden="true">*</span></label>
                    <input id="name" name="name" type="text" autocomplete="name" required>
                </div>
                <div class="form-field">
                    <label for="email">メールアドレス <span aria-hidden="true">*</span></label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <fieldset class="form-fieldset">
                    <legend>参加形態 <span aria-hidden="true">*</span></legend>
                    <label><input type="radio" name="participation" value="individual" required> 個人</label>
                    <label><input type="radio" name="participation" value="team"> チーム</label>
                </fieldset>
                <div class="form-field">
                    <label for="team">チーム名</label>
                    <input id="team" name="team" type="text">
                </div>
                <div class="form-field">
                    <label for="message">連絡事項</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>
                <label class="agree-field"><input type="checkbox" name="agree" required> 注意事項と個人情報の取り扱いに同意する <span aria-hidden="true">*</span></label>
                <button class="btn" type="submit">申し込む</button>
            </form>
            <p class="form-note">※ このフォームは見本です。</p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">&copy; <span id="year"></span> 防衛省企業プロジェクト</div>
    </footer>
    <script src="js/main.js" defer></script>
</body>
</html>
